---
- name: Debug connectivity and SSH from Cisco ASA to SCP Server
  hosts: asa_firewalls
  gather_facts: false

  tasks:
    - name: Ping SCP server from ASA management interface
      cisco.asa.asa_command:
        commands:
          - "ping management 10.0.1.10"
      register: ping_res

    - name: Display ping output
      ansible.builtin.debug:
        var: ping_res.stdout_lines

    - name: Show ARP table on ASA
      cisco.asa.asa_command:
        commands:
          - "show arp"
      register: arp_res

    - name: Display ARP table
      ansible.builtin.debug:
        var: arp_res.stdout_lines

    - name: Show SSH config on ASA
      cisco.asa.asa_command:
        commands:
          - "show running-config ssh"
      register: ssh_res

    - name: Display SSH config
      ansible.builtin.debug:
        var: ssh_res.stdout_lines
