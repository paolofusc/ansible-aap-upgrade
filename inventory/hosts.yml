---
all:
  children:
    asa_firewalls:
      hosts:
        awx-asa:
          ansible_host: 10.0.1.9
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.asa.asa
        ansible_user: admin
        ansible_password: Cisco1@3
        ansible_become: true
        ansible_become_method: enable
        ansible_become_password: Cisco1@3
        # SCP / File Server settings
        scp_server: 10.0.1.10
        scp_user: scp
        scp_password: scp1234567890
        # Folder paths on SCP server (relative to scp user home / FileBrowser root)
        scp_dir: "backups/"
        scp_images_dir: "images/"
        # Passphrase used by ASA backup command to encrypt keys/certificates in the archive
        backup_passphrase: "Cisco1@3"
